spring:
  application:
    name: appv4-back
  # local seulement quand aucun autre profil n'est choisi.
  # Les tests activent "test" : ils ne doivent pas hériter du profil local
  # (base de dev, Flyway, seed admin). CI / prod passent par SPRING_PROFILES_ACTIVE.
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # Flyway est l'autorité du schéma — Hibernate ne crée / ne modifie pas les tables
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}

# OpenAPI (SCRUM-147) — Swagger UI off hors local ; /v3/api-docs reste utile pour le contrat
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

# JWT admin (/api/int) — surcharger via APPV4_JWT_SECRET en prod (min. 32 octets)
# Google OAuth (SCRUM-96) — GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET hors git
appv4:
  jwt:
    secret: ${APPV4_JWT_SECRET:appv4-local-dev-jwt-secret-change-me-32b}
    issuer: ${APPV4_JWT_ISSUER:appv4-back}
    expiration-minutes: ${APPV4_JWT_EXPIRATION_MINUTES:480}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    facebook:
      app-id: ${FACEBOOK_APP_ID:}
      app-secret: ${FACEBOOK_APP_SECRET:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}

