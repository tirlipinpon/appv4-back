# CD Azure — déclenché après merge vers release (PR develop → release).
# SCRUM-80 : deploy réel App Service (gate AZURE_DEPLOY_ENABLED).
name: CD release (backend)

on:
  push:
    branches:
      - release
      - "release/**"
  workflow_dispatch:

concurrency:
  group: cd-back-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appv4
          POSTGRES_USER: appv4
          POSTGRES_PASSWORD: appv4
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appv4 -d appv4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/appv4
      SPRING_DATASOURCE_USERNAME: appv4
      SPRING_DATASOURCE_PASSWORD: appv4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Lint (Checkstyle)
        run: ./mvnw -B checkstyle:check

      - name: Run tests
        run: ./mvnw -B test

      - name: Package
        run: ./mvnw -B -DskipTests package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: appv4-back-jar
          path: |
            target/appv4-back-*.jar
            !target/*.original
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: appv4-back-jar
          path: dist

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy JAR to App Service
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          JAR=$(ls dist/appv4-back-*.jar | head -n1)
          echo "Deploying $JAR → $AZURE_WEBAPP_NAME ($AZURE_RESOURCE_GROUP)"
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path "$JAR" \
            --type jar
