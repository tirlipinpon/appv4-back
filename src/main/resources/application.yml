spring:
  application:
    name: appv4-back
  # Profil par défaut pour le MVP local (surchargeable via SPRING_PROFILES_ACTIVE)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway est l'autorité du schéma — Hibernate ne crée / ne modifie pas les tables
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}

# JWT admin (/api/int) — surcharger via APPV4_JWT_SECRET en prod (min. 32 octets)
# Google OAuth (SCRUM-96) — GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET hors git
appv4:
  jwt:
    secret: ${APPV4_JWT_SECRET:appv4-local-dev-jwt-secret-change-me-32b}
    issuer: ${APPV4_JWT_ISSUER:appv4-back}
    expiration-minutes: ${APPV4_JWT_EXPIRATION_MINUTES:480}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    facebook:
      app-id: ${FACEBOOK_APP_ID:}
      app-secret: ${FACEBOOK_APP_SECRET:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}

