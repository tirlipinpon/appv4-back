name: CI develop (backend)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, release, "release/**"]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appv4
          POSTGRES_USER: appv4
          POSTGRES_PASSWORD: appv4
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appv4 -d appv4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/appv4
      SPRING_DATASOURCE_USERNAME: appv4
      SPRING_DATASOURCE_PASSWORD: appv4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Lint (Checkstyle)
        run: ./mvnw -B checkstyle:check

      - name: Run tests
        run: ./mvnw -B test

      - name: Package
        run: ./mvnw -B -DskipTests package
