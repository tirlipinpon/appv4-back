# Profil "local" — Postgres via Docker Compose
# Activé seulement si SPRING_PROFILES_ACTIVE=local (jamais par défaut).
# Variables : voir .env / .env.example (SPRING_DATASOURCE_* ou POSTGRES_*)

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appv4}
    username: ${SPRING_DATASOURCE_USERNAME:appv4}
    password: ${SPRING_DATASOURCE_PASSWORD:appv4}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# Origines Angular locales (learning / admin — ports ng serve typiques)
appv4:
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:4201
  auth:
    password-reset:
      token-ttl: 45m
      frontend-reset-url: http://localhost:4201/reset-password
    # Compte admin local (SCRUM-142). Le clair reste dans .env, pas dans git.
    admin-seed:
      email: ${APPV4_ADMIN_EMAIL:}
      password: ${APPV4_ADMIN_PASSWORD:}

# Swagger UI uniquement en local (SCRUM-147)
springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    org.hibernate.SQL: INFO
    org.flywaydb: INFO
