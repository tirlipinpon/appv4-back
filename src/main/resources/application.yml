spring:
  application:
    name: appv4-back
  # Pas de profil par défaut : sans SPRING_PROFILES_ACTIVE (ou .env local),
  # Swagger / seed admin / application-local.yml ne s'activent pas par oubli.
  # Local : SPRING_PROFILES_ACTIVE=local (voir .env.example).
  # Tests : @ActiveProfiles("test"). CI / Azure : variable explicite.
  jpa:
    open-in-view: false
    hibernate:
      # Flyway est l'autorité du schéma — Hibernate ne crée / ne modifie pas les tables
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}

# OpenAPI (SCRUM-147) — Swagger UI off hors local ; /v3/api-docs reste utile pour le contrat
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

# JWT admin (/api/int) — pas de secret de démo ici (issue #62).
# Hors local : APPV4_JWT_SECRET obligatoire (min. 32 octets). Local : voir application-local.yml.
# Google OAuth (SCRUM-96) — GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET hors git
appv4:
  jwt:
    secret: ${APPV4_JWT_SECRET:}
    issuer: ${APPV4_JWT_ISSUER:appv4-back}
    expiration-minutes: ${APPV4_JWT_EXPIRATION_MINUTES:480}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    facebook:
      app-id: ${FACEBOOK_APP_ID:}
      app-secret: ${FACEBOOK_APP_SECRET:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}

