# Profil "local" — Postgres via Docker Compose
# Variables : voir .env / .env.example (SPRING_DATASOURCE_* ou POSTGRES_*)

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appv4}
    username: ${SPRING_DATASOURCE_USERNAME:appv4}
    password: ${SPRING_DATASOURCE_PASSWORD:appv4}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: INFO
    org.flywaydb: INFO
